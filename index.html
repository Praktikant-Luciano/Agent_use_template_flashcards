<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pain Diary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>Pain Diary</h1>

        <form id="entry-form" class="entry-form">
            <div class="form-field">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-field">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>
            </div>

            <div class="form-field">
                <label for="nrs">NRS</label>
                <select id="nrs" name="nrs" required>
                    <option value="" disabled selected>Select</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>

            <div class="form-field measure-field">
                <label for="measure">Measure</label>
                <select id="measure" name="measure" required>
                    <option value="None" selected>None</option>
                    <option value="Pain medication as prescribed">Pain medication as prescribed</option>
                    <option value="Physical measure cold">Physical measure cold</option>
                    <option value="Physical measure warm">Physical measure warm</option>
                    <option value="Other non-pharmacological measure">Other non-pharmacological measure</option>
                </select>
            </div>

            <div class="form-field note-field">
                <label for="note">Note</label>
                <select id="note" name="note" required>
                    <option value="No exercise" selected>No exercise</option>
                    <option value="Early mobilization">Early mobilization</option>
                    <option value="Assisted bed-to-chair transfer">Assisted bed-to-chair transfer</option>
                    <option value="Assisted standing trial">Assisted standing trial</option>
                    <option value="Assisted walking > 20 m">Assisted walking &gt; 20 m</option>
                    <option value="Breathing trial">Breathing trial</option>
                </select>
            </div>

            <button type="submit" id="add-entry">add entry</button>
        </form>

        <div class="table-container">
            <table id="entry-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>NRS</th>
                        <th>Bar</th>
                        <th>Measure</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody id="entry-table-body">
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <section id="entry-summary" class="entry-summary" aria-label="Entry summary">
            <h2>Summary</h2>
            <p>Number of entries: <strong id="entry-count">0</strong></p>
            <p>Minimum NRS: <strong id="nrs-minimum">-</strong></p>
            <p>Maximum NRS: <strong id="nrs-maximum">-</strong></p>
            <p>Mean NRS: <strong id="nrs-mean">-</strong></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
