<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Vocab Flashcards</h1>

        <form id="word-form">
            <label for="english-word">English</label>
            <input type="text" id="english-word" name="english" required>

            <label for="german-word">Deutsch</label>
            <input type="text" id="german-word" name="german" required>

            <button type="submit">Hinzufügen</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
